# Pipeline Logstash : reception Beats, enrichissement, indexation Elasticsearch.

input {
  beats {
    port => 5044
  }
}

filter {
  if [application] == "api-ventes" {
    # Horodatage produit par l'API (champ "@timestamp" ou "timestamp").
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
      mutate { remove_field => ["timestamp"] }
    }
    if [http][statut] {
      if [http][statut] >= 500 {
        mutate { add_field => { "categorie_statut" => "5xx" } }
      } else if [http][statut] >= 400 {
        mutate { add_field => { "categorie_statut" => "4xx" } }
      } else {
        mutate { add_field => { "categorie_statut" => "2xx-3xx" } }
      }
    }
    mutate { add_field => { "[@metadata][index]" => "api-ventes-logs" } }
  }
  else if [application] == "airflow" {
    # Format Airflow : [2026-10-19T10:00:00.123+0000] {fichier.py:42} INFO - message
    grok {
      match => {
        "message" => "^\[%{TIMESTAMP_ISO8601:horodatage}\] \{%{DATA:source_code}\} %{LOGLEVEL:level} - %{GREEDYDATA:contenu}"
      }
      tag_on_failure => ["_airflow_format_inconnu"]
    }
    if [horodatage] {
      date {
        match => ["horodatage", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
        target => "@timestamp"
      }
    }
    # Bilan JSON emis par la tache publier_rapport
    if [contenu] =~ /^BILAN_ETL / {
      ruby {
        code => "event.set('bilan_brut', event.get('contenu').sub(/^BILAN_ETL /, ''))"
      }
      json {
        source => "bilan_brut"
        target => "bilan"
        remove_field => ["bilan_brut"]
      }
    }
    mutate {
      lowercase => ["level"]
      remove_field => ["horodatage"]
      add_field => { "[@metadata][index]" => "airflow-logs" }
    }
  }
  else {
    mutate { add_field => { "[@metadata][index]" => "autres-logs" } }
  }

  mutate { remove_field => ["agent", "ecs", "input", "host"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
